apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: ordersystem
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orders-api
  template:
    metadata:
      labels:
        app: orders-api
    spec:
      containers:
        - name: orders-api
          image: orders-api:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: ordersystem-config
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: ordersystem-secrets
                  key: POSTGRES_USERNAME
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ordersystem-secrets
                  key: POSTGRES_PASSWORD
            - name: ConnectionStrings__Database
              value: "Host=postgres;Port=5432;Database=ordersystem;Username=$(POSTGRES_USERNAME);Password=$(POSTGRES_PASSWORD)"
            - name: RabbitMQ__Username
              valueFrom:
                secretKeyRef:
                  name: ordersystem-secrets
                  key: RABBITMQ_USERNAME
            - name: RabbitMQ__Password
              valueFrom:
                secretKeyRef:
                  name: ordersystem-secrets
                  key: RABBITMQ_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: orders-api
  namespace: ordersystem
spec:
  type: ClusterIP
  selector:
    app: orders-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080